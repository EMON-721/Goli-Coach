services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/golicoach.sqlite
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - coach-data:/data
    expose:
      - '8000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your HTTPS hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  coach-data:
  proxy-data:
  proxy-config:
