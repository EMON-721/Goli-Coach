# Free compute only. Durable database and email provider accounts are configured separately.
services:
  - type: web
    name: goli-coach-backend
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /tmp/golicoach-unused.sqlite
      - key: REQUIRE_REMOTE_DATABASE
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: SERVER_VIDEO_ENABLED
        value: '0'
      - key: SECURE_COOKIES
        value: '1'
      - key: REQUIRE_EMAIL_VERIFICATION
        value: '1'
      - key: APP_ORIGIN
        sync: false
      - key: MAIL_TRANSPORT
        value: resend
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
