# Deployment creates paid CPU/disk resources; review the Render estimate first.
services:
  - type: web
    name: goli-coach-backend
    runtime: docker
    plan: 1c-2g
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: goli-coach-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/golicoach.sqlite
      - key: SECURE_COOKIES
        value: '1'
      - key: REQUIRE_EMAIL_VERIFICATION
        value: '1'
      - key: APP_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
