name: GoliCoach checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: node scripts/prepare-assets.mjs
      - run: python scripts/download_model.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r server/requirements.lock
      - run: python scripts/download_model.py
      - run: python -m pytest tests/test_api.py tests/model_inference_test.py tests/test_bangladesh_evaluation.py tests/test_auth_recovery.py tests/test_maintenance.py tests/test_sharing.py tests/test_smtp_check.py tests/test_split_origin.py -q
